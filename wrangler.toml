name = "cuentas-y-ahorro"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = true
routes = [
  { pattern = "danieta.com/cuentasyahorro*", zone_name = "danieta.com" }
]

[build]
command = "pnpm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/cuentasyahorro*"]

[[d1_databases]]
binding = "DB"
database_name = "cuentas-y-ahorro"
database_id = "c36ab24b-31a9-4a17-804e-67791cecbece"
migrations_dir = "migrations"

[observability]
enabled = true
